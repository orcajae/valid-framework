name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + dev)
        run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest tests/ -v

  reproduce-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev)
        run: pip install -e ".[dev]"
      - name: Smoke reproduction (synthetic data, sklearn fallback model)
        run: python experiments/reproduce_all.py --smoke
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            results/*.csv
            results/REPRODUCE_SUMMARY.md
            results/worked_example/
