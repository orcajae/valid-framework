[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valid-framework"
dynamic = ["version"]
description = "VALID: Validation Architecture for Learning-based Investment Decisions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Jaewook Kim"}]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/orcajae/valid-framework"
Paper = "https://ssrn.com/abstract=6508779"

[project.optional-dependencies]
ml = ["catboost>=1.2", "lightgbm>=4.0", "torch>=2.0"]
data = ["ccxt>=4.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["valid"]

[tool.setuptools.dynamic]
version = {attr = "valid.__version__"}
